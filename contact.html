<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Aéro Réglementation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">✈️ Aéro Réglementation</div>
      <nav>
        <a href="index.html">Accueil</a>
        <a href="articles.html">Articles</a>
        <a href="apropos.html">À propos</a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <h1>Contact</h1>
    <p>Une question, une suggestion ou une correction ? Écrivez-nous.</p>
  </section>

  <main class="container">
    <form class="contact-form">
      <label for="nom">Nom</label>
      <input type="text" id="nom" placeholder="Votre nom" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="votre@email.com" required />

      <label for="message">Message</label>
      <textarea id="message" rows="6" placeholder="Votre message..." required></textarea>

      <button type="submit" class="btn">Envoyer</button>
    </form>
  </main>

  <footer>
    <p>© 2026 Aéro Réglementation — Tous droits réservés</p>
  </footer>

</body>
</html>
